name: Temporary issue relationship verification

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Export dependency and sub-issue graphs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import concurrent.futures
          import os
          import subprocess

          repo = os.environ['REPO']

          def values(path: str, jq: str) -> str:
              result = subprocess.run(
                  ['gh', 'api', '--paginate', path, '--jq', jq],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  return ''
              return ','.join(line for line in result.stdout.splitlines() if line)

          def audit(issue: int):
              blocked_by = values(
                  f'repos/{repo}/issues/{issue}/dependencies/blocked_by?per_page=100',
                  '.[].number',
              )
              blocks = values(
                  f'repos/{repo}/issues/{issue}/dependencies/blocking?per_page=100',
                  '.[].number',
              )
              sub_issues = values(
                  f'repos/{repo}/issues/{issue}/sub_issues?per_page=100',
                  '.[].number',
              )
              parent = values(
                  f'repos/{repo}/issues/{issue}/parent',
                  '.number',
              )
              return issue, blocked_by, blocks, parent, sub_issues

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              rows = list(executor.map(audit, range(1, 257)))

          with open('dependency-graph-final.tsv', 'w', encoding='utf-8') as output:
              output.write('issue\tblocked_by\tblocks\n')
              for issue, blocked_by, blocks, _, _ in rows:
                  if blocked_by or blocks:
                      output.write(f'{issue}\t{blocked_by}\t{blocks}\n')

          with open('sub-issue-graph.tsv', 'w', encoding='utf-8') as output:
              output.write('issue\tparent\tsub_issues\n')
              for issue, _, _, parent, sub_issues in rows:
                  if parent or sub_issues:
                      output.write(f'{issue}\t{parent}\t{sub_issues}\n')
          PY

      - name: Upload relationship graphs
        uses: actions/upload-artifact@v4
        with:
          name: issue-relationship-graphs
          path: |
            dependency-graph-final.tsv
            sub-issue-graph.tsv
          if-no-files-found: error
