name: Temporary dependency audit

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Export native issue dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import concurrent.futures
          import os
          import subprocess

          repo = os.environ['REPO']

          def numbers(path: str) -> str:
              result = subprocess.run(
                  ['gh', 'api', '--paginate', path, '--jq', '.[].number'],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if result.returncode != 0:
                  return ''
              return ','.join(line for line in result.stdout.splitlines() if line)

          def audit(issue: int):
              blocked_by = numbers(f'repos/{repo}/issues/{issue}/dependencies/blocked_by?per_page=100')
              blocks = numbers(f'repos/{repo}/issues/{issue}/dependencies/blocking?per_page=100')
              if blocked_by or blocks:
                  return issue, blocked_by, blocks
              return None

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              rows = [row for row in executor.map(audit, range(1, 247)) if row]

          with open('dependency-graph.tsv', 'w', encoding='utf-8') as output:
              output.write('issue\tblocked_by\tblocks\n')
              for issue, blocked_by, blocks in rows:
                  output.write(f'{issue}\t{blocked_by}\t{blocks}\n')

          print(f'Exported {len(rows)} issues with native dependencies.')
          PY

      - name: Upload dependency graph
        uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: dependency-graph.tsv
          if-no-files-found: error
