name: Temporary sub-issue correction

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Apply native sub-issue parents with GraphQL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          owner, name = os.environ['REPO'].split('/', 1)
          links = [
              *[(235, child) for child in range(236, 243)],
              (8, 249),
              (10, 244), (10, 220),
              (12, 250),
              (13, 245), (13, 254),
              (14, 251),
              (21, 253),
              (22, 255),
              (23, 256),
              (24, 252),
              (25, 246),
              (146, 219),
          ]

          numbers = sorted({number for link in links for number in link})
          fields = '\n'.join(
              f'i{number}: issue(number: {number}) {{ id number }}'
              for number in numbers
          )
          query = f'''query($owner: String!, $name: String!) {{
            repository(owner: $owner, name: $name) {{
              {fields}
            }}
          }}'''

          lookup = subprocess.run(
              [
                  'gh', 'api', 'graphql',
                  '-f', f'query={query}',
                  '-F', f'owner={owner}',
                  '-F', f'name={name}',
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          payload = json.loads(lookup.stdout)
          repository = payload['data']['repository']
          node_ids = {
              number: repository[f'i{number}']['id']
              for number in numbers
          }

          mutation_fields = []
          for index, (parent, child) in enumerate(links):
              mutation_fields.append(
                  f'''m{index}: addSubIssue(input: {{
                    issueId: "{node_ids[parent]}"
                    subIssueId: "{node_ids[child]}"
                    replaceParent: true
                  }}) {{
                    issue {{ number }}
                    subIssue {{ number }}
                  }}'''
              )

          mutation = 'mutation {\n' + '\n'.join(mutation_fields) + '\n}'
          result = subprocess.run(
              ['gh', 'api', 'graphql', '-f', f'query={mutation}'],
              check=False,
              capture_output=True,
              text=True,
          )

          with open('sub-issue-graphql-result.json', 'w', encoding='utf-8') as output:
              output.write(result.stdout or result.stderr)

          if result.returncode != 0:
              raise SystemExit(result.stderr or result.stdout)

          response = json.loads(result.stdout)
          if response.get('errors'):
              raise SystemExit(json.dumps(response['errors'], indent=2))

          print(f'Applied {len(links)} native sub-issue relationships.')
          PY

      - name: Upload correction result
        uses: actions/upload-artifact@v4
        with:
          name: sub-issue-graphql-result
          path: sub-issue-graphql-result.json
          if-no-files-found: error
