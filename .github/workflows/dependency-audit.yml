name: Temporary sub-issue correction

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Apply native sub-issue corrections
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time

          repo = os.environ['REPO']

          remove_links = [
              (147, 219),
              (9, 220),
              (25, 49),
              (23, 139), (23, 140), (23, 141), (23, 142),
          ]

          add_links = [
              *[(235, child) for child in range(236, 243)],
              (8, 249),
              (10, 244), (10, 220),
              (12, 250),
              (13, 245), (13, 254),
              (14, 251),
              (21, 253),
              (22, 255),
              (23, 256),
              (24, 252),
              (25, 246),
              (146, 219),
          ]

          def run(args):
              return subprocess.run(args, check=False, capture_output=True, text=True)

          ids = {}
          def issue_id(number):
              if number not in ids:
                  result = run(['gh', 'api', f'repos/{repo}/issues/{number}', '--jq', '.id'])
                  ids[number] = result.stdout.strip()
              return ids[number]

          def child_ids(parent):
              result = run([
                  'gh', 'api', '--paginate',
                  f'repos/{repo}/issues/{parent}/sub_issues?per_page=100',
                  '--jq', '.[].id',
              ])
              return set(result.stdout.split()) if result.returncode == 0 else set()

          lines = []
          for parent, child in remove_links:
              child_id = issue_id(child)
              if child_id not in child_ids(parent):
                  lines.append(f'SKIP REMOVE {parent} {child}')
                  continue
              result = run([
                  'gh', 'api', '--method', 'DELETE',
                  f'repos/{repo}/issues/{parent}/sub_issue',
                  '-F', f'sub_issue_id={child_id}',
              ])
              if result.returncode == 0:
                  lines.append(f'REMOVE {parent} {child}')
              else:
                  message = (result.stderr or result.stdout).strip().replace('\n', ' ')
                  lines.append(f'ERROR REMOVE {parent} {child} {message}')
              time.sleep(0.2)

          for parent, child in add_links:
              child_id = issue_id(child)
              if child_id in child_ids(parent):
                  lines.append(f'SKIP ADD {parent} {child}')
                  continue
              result = run([
                  'gh', 'api', '--method', 'POST',
                  f'repos/{repo}/issues/{parent}/sub_issues',
                  '-F', f'sub_issue_id={child_id}',
              ])
              if result.returncode == 0:
                  lines.append(f'ADD {parent} {child}')
              else:
                  message = (result.stderr or result.stdout).strip().replace('\n', ' ')
                  lines.append(f'ERROR ADD {parent} {child} {message}')
              time.sleep(0.2)

          with open('sub-issue-correction.log', 'w', encoding='utf-8') as output:
              output.write('\n'.join(lines) + '\n')
          print(f'Processed {len(lines)} sub-issue operations.')
          PY

      - name: Upload correction results
        uses: actions/upload-artifact@v4
        with:
          name: sub-issue-correction-results
          path: sub-issue-correction.log
          if-no-files-found: error
