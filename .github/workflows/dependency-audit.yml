name: Temporary dependency audit

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Export native issue dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import concurrent.futures
          import os
          import subprocess

          repo = os.environ['REPO']

          def numbers(path: str) -> str:
              result = subprocess.run(
                  ['gh', 'api', '--paginate', path, '--jq', '.[].number'],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              return ','.join(line for line in result.stdout.splitlines() if line)

          def audit(issue: int):
              blocked_by = numbers(f'repos/{repo}/issues/{issue}/dependencies/blocked_by?per_page=100')
              blocks = numbers(f'repos/{repo}/issues/{issue}/dependencies/blocking?per_page=100')
              if blocked_by or blocks:
                  return issue, blocked_by, blocks
              return None

          print('DEPENDENCY_AUDIT_BEGIN')
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as executor:
              rows = [row for row in executor.map(audit, range(1, 247)) if row]
          for issue, blocked_by, blocks in rows:
              print(f'ISSUE={issue} BLOCKED_BY={blocked_by} BLOCKS={blocks}')
          print('DEPENDENCY_AUDIT_END')
          PY
