name: Temporary dependency audit

on:
  push:
    branches:
      - audit/native-dependency-graph

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Export native issue dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'DEPENDENCY_AUDIT_BEGIN'
          for issue in $(seq 1 246); do
            blockers=$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${REPO}/issues/${issue}/dependencies/blocked_by?per_page=100" \
              --jq '.[].number' 2>/dev/null | paste -sd, - || true)
            blocking=$(gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/${REPO}/issues/${issue}/dependencies/blocking?per_page=100" \
              --jq '.[].number' 2>/dev/null | paste -sd, - || true)
            if [[ -n "${blockers}" || -n "${blocking}" ]]; then
              printf 'ISSUE=%s BLOCKED_BY=%s BLOCKS=%s\n' "$issue" "${blockers:-}" "${blocking:-}"
            fi
          done
          echo 'DEPENDENCY_AUDIT_END'
